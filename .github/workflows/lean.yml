name: Lean CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Direct kernel audit and regression check
        shell: bash
        run: |
          set -euo pipefail
          lake env lean TratadoAnalisis/Audit.lean > audit.log 2>&1 || { tail -n 100 audit.log; exit 1; }
          python3 scripts/check_audit.py audit.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
