name: Lean CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Exact C08 kernel audit and regression check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_release_v020.py
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
