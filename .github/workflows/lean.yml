name: Lean CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Direct kernel audit and regression check
        shell: bash
        run: |
          set -euo pipefail
          lake env lean TratadoAnalisis/Audit.lean > audit.log 2>&1 || { tail -n 100 audit.log; exit 1; }
          python3 scripts/check_audit.py audit.log
          lake env lean tests/PublicAPI.lean > public-api.log 2>&1 || { tail -n 100 public-api.log; exit 1; }
          python3 scripts/check_public_api.py audit.log public-api.log
          lake env lean tests/Prerequisites.lean > prerequisites.log 2>&1 || { tail -n 100 prerequisites.log; exit 1; }
          python3 scripts/check_prerequisites.py prerequisites.log
          lake env lean tests/AbsoluteValue.lean > absolute-value.log 2>&1 || { tail -n 120 absolute-value.log; exit 1; }
          python3 scripts/check_absolute_value.py absolute-value.log
          lake env lean tests/CompletenessEquivalences.lean > completeness-equivalences.log 2>&1 || { tail -n 160 completeness-equivalences.log; exit 1; }
          python3 scripts/check_completeness_equivalences.py completeness-equivalences.log
          lake env lean tests/NumeralArithmetic.lean > numeral-arithmetic.log 2>&1 || { tail -n 160 numeral-arithmetic.log; exit 1; }
          python3 scripts/check_numeral_arithmetic.py numeral-arithmetic.log
          lake env lean tests/CauchyA1.lean > cauchy-a1.log 2>&1 || { tail -n 160 cauchy-a1.log; exit 1; }
          python3 scripts/check_cauchy_a1.py audit.log public-api.log prerequisites.log absolute-value.log completeness-equivalences.log numeral-arithmetic.log cauchy-a1.log
          lake env lean tests/CauchyA2.lean > cauchy-a2.log 2>&1 || { tail -n 160 cauchy-a2.log; exit 1; }
          python3 scripts/check_cauchy_a2.py cauchy-a2.log
          lake env lean tests/CauchyA3.lean > cauchy-a3.log 2>&1 || { tail -n 180 cauchy-a3.log; exit 1; }
          python3 scripts/check_cauchy_a3.py cauchy-a3.log
          lake env lean tests/CauchyA4.lean > cauchy-a4.log 2>&1 || { tail -n 180 cauchy-a4.log; exit 1; }
          python3 scripts/check_cauchy_a4.py cauchy-a4.log
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
