name: Lean CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Direct kernel audit and regression check
        shell: bash
        run: |
          set -euo pipefail
          lake env lean TratadoAnalisis/Audit.lean > audit.log 2>&1 || { tail -n 100 audit.log; exit 1; }
          python3 scripts/check_audit.py audit.log
          lake env lean tests/PublicAPI.lean > public-api.log 2>&1 || { tail -n 100 public-api.log; exit 1; }
          python3 scripts/check_public_api.py audit.log public-api.log
          sha256sum -c certificates/v0.1.1/SHA256SUMS
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
